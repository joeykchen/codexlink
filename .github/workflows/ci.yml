name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22.x', stable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Verify release version injection
        run: ./scripts/test-version.sh
      - name: Race detector
        if: matrix.go == 'stable'
        run: go test -race ./...

  installer-unix:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate shell syntax
        run: sh -n install.sh scripts/*.sh
      - name: Test self-contained installer
        run: ./scripts/test-install.sh

  installer-windows:
    name: installer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @('install.ps1', 'scripts/install.ps1', 'scripts/test-install.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${path}: $_" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Test self-contained installer
        shell: pwsh
        run: ./scripts/test-install.ps1

  cross-build:
    name: supported release targets
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - run: ./scripts/build.sh
